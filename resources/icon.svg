<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <!-- Code lines on left with indentation (representing editor code) -->
  <line x1="2.5" y1="5.5" x2="8.5" y2="5.5" stroke-width="1.8"/>
  <line x1="2.5" y1="8.8" x2="6.8" y2="8.8" stroke-width="1.8"/>
  <line x1="4.5" y1="12.1" x2="8.5" y2="12.1" stroke-width="1.8"/>
  <line x1="4.5" y1="15.4" x2="7.0" y2="15.4" stroke-width="1.8"/>
  <line x1="2.5" y1="18.7" x2="8.0" y2="18.7" stroke-width="1.8"/>

  <!-- Split terminal panel on right -->
  <rect x="10.8" y="3.2" width="10.4" height="17.6" rx="3" stroke-width="1.8"/>
  
  <!-- Agent / Status dot -->
  <circle cx="13.5" cy="6.2" r="1" fill="currentColor" stroke="none"/>
  
  <!-- Terminal prompt '> _' -->
  <path d="M13.2 12.8L15.8 15L13.2 17.2" stroke-width="2"/>
  <line x1="17.2" y1="17.2" x2="19.4" y2="17.2" stroke-width="2"/>
</svg>
